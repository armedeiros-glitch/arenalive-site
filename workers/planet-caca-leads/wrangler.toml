name = "planet-caca-leads"
main = "index.js"
compatibility_date = "2026-08-06"
workers_dev = false

[triggers]
# 11:00 UTC corresponde a 08:00 no horário de Brasília.
crons = ["0 11 * * *"]

[vars]
PLANET_LEAD_HUNT_LOCATIONS = "Joinville|SC|-26.3045|-48.8487|24000"
PLANET_LEAD_HUNT_SEGMENTS = "cafeteria,sorveteria,açaí,chocolateria,confeitaria,alimentação em shopping"
PLANET_LEAD_HUNT_MAX_RESULTS = "40"
OVERPASS_API_URL = "https://overpass-api.de/api/interpreter"

# Configurar no painel da Cloudflare antes de publicar:
# - binding KV PLANET_HUB_DATA apontando para o mesmo namespace do André OS;
# - secret CACA_LEADS_RUN_TOKEN para execuções manuais do Worker.
