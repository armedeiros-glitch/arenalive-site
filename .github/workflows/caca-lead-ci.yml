name: Aplicar auditoria do Caça Lead

on:
  push:
    branches:
      - feature/expansion-caca-lead
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caca-lead-audit-apply
  cancel-in-progress: false

jobs:
  apply-audit:
    name: Consolidar arquitetura auditada
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar a branch
        uses: actions/checkout@v4
        with:
          ref: feature/expansion-caca-lead
          fetch-depth: 0

      - name: Aplicar correções sem camadas paralelas
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(.audit/caca-rem-*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "Nenhum patch temporário encontrado."
            exit 0
          fi
          for patch_file in "${patches[@]}"; do
            echo "Aplicando $patch_file"
            patch --batch --forward -p3 < "$patch_file"
          done
          rm -rf .audit

      - name: Gravar consolidação na própria branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(expansion): remove camadas e consolida integrações"
          git push origin HEAD:feature/expansion-caca-lead
