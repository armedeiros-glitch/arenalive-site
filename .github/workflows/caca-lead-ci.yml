name: Caça Lead CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caca-lead-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Sintaxe e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            mime=$(file --brief --mime-type "$file")
            if [[ "$mime" == text/* || "$mime" == application/javascript ]]; then
              node --check "$file"
            else
              echo "Ignorando asset não textual ($mime): $file"
            fi
          done < <(find functions planet-hub/assets -type f -name '*.js' -print0)

      - name: Executar suíte completa
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' test_file; do
            found=1
            echo "Executando $test_file"
            node "$test_file"
          done < <(find tests -maxdepth 1 -type f -name '*.test.mjs' -print0 | sort -z)
          if [ "$found" -eq 0 ]; then
            echo "Nenhum teste .test.mjs encontrado."
            exit 1
          fi

      - name: Disponibilizar fontes auditadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caca-lead-source
          path: .
          include-hidden-files: false
          retention-days: 1
