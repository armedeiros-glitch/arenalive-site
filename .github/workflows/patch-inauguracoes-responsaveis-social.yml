name: Patch inaugurações responsáveis social
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/inauguracoes-responsaveis-social-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inauguracoes-responsaveis-social-20260820
      - name: Carregar regras de responsáveis no runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          anchor = '    <script defer src="/planet-hub/assets/inauguration-schedule-print-v1.js?v=20260819-1"></script>\n'
          tag = '    <script defer src="/planet-hub/assets/inauguration-owner-rules-v1.js?v=20260820-1"></script>\n'
          if tag not in s:
              s = s.replace(anchor, anchor + tag)
          p.write_text(s)

          t = Path('tests/inauguration-social-owner-v1.test.mjs')
          t.write_text("""import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n\nconst rules = await readFile(new URL('../planet-hub/assets/inauguration-owner-rules-v1.js', import.meta.url), 'utf8');\nconst html = await readFile(new URL('../index.html', import.meta.url), 'utf8');\nassert.match(rules, /criacao\\/ajuste do instagram'\\) return 'Franqueadora'/);\nassert.match(rules, /criacao\\/ajuste do facebook'\\) return 'Franqueadora'/);\nassert.match(rules, /google meu negocio'\\) return 'Franqueadora'/);\nassert.match(rules, /video de inauguracao'\\) return 'Franqueado'/);\nassert.match(html, /inauguration-owner-rules-v1\\.js\\?v=20260820-1/);\nconsole.log('Inaugurações: responsáveis sociais e vídeo corrigidos.');\n""")
          PY
      - name: Testar regra
        run: node tests/inauguration-social-owner-v1.test.mjs
      - name: Commitar runtime
        run: |
          git config user.name "andre-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/inauguration-social-owner-v1.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: aplica responsáveis corretos nas inaugurações"
          git push
