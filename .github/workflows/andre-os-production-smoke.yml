name: André OS Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Produção · rotas públicas e proteção
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar página principal
        shell: bash
        run: |
          set -euo pipefail
          base="https://arenalivebrasil.com.br"
          code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$base/")"
          echo "GET / -> $code"
          test "$code" = "200"
          grep -q 'André OS' /tmp/home.html

      - name: Verificar publicação dos JS críticos
        shell: bash
        run: |
          set -euo pipefail
          base="https://arenalivebrasil.com.br"

          fetch_asset() {
            local path="$1"
            local output="$2"
            local marker="$3"
            local code
            code="$(curl -sS -L -o "$output" -w '%{http_code}' "$base$path")"
            echo "GET $path -> $code"
            test "$code" = "200"
            grep -Fq "$marker" "$output"
          }

          python - <<'PY'
          home = open('/tmp/home.html', encoding='utf-8').read()
          policy = 'inauguration-core-policy-v1.js?v=20260828-1'
          access = 'hub-access-v1.js?v=20260828-4'
          assert policy in home, 'política canônica não publicada no HTML'
          assert access in home, 'bootstrap não publicado no HTML'
          assert home.index(policy) < home.index(access), 'política canônica precisa carregar antes do bootstrap'
          print('inauguration core policy boot order ok')
          PY

          fetch_asset '/planet-hub/assets/hub-access-v1.js?v=20260828-4' /tmp/hub-access.js 'planet-expansion-contact-trail-v1.js?v=20260828-1'
          grep -Fq 'andre-os-operational-reconciliation-v1.js?v=20260828-2' /tmp/hub-access.js
          grep -Fq 'andre-os-radar-home-v1.js?v=20260828-1' /tmp/hub-access.js

          fetch_asset '/planet-hub/assets/radar-data-v1.js?v=20260828-1' /tmp/radar-data.js 'ticketHasAndreSupport'
          fetch_asset '/planet-hub/assets/inauguration-core-policy-v1.js?v=20260828-1' /tmp/inauguration-core-policy.js 'PlanetInaugurationCorePolicy'
          grep -Fq 'Checklist de 17 etapas e seis ações inaugurais' /tmp/inauguration-core-policy.js
          grep -Fq 'operationalActive' /tmp/inauguration-core-policy.js
          fetch_asset '/planet-hub/assets/inauguration-owner-rules-v1.js?v=20260828-1' /tmp/inauguration-owner-rules.js 'Enviar contato/indicação de Social Media local'
          fetch_asset '/planet-hub/assets/andre-os-eject-v1.js?v=20260828-3' /tmp/andre-os-eject.js 'implantacoes?start=0&limit=100&scope=all'

      - name: Verificar contrato público de sessão
        shell: bash
        run: |
          set -euo pipefail
          base="https://arenalivebrasil.com.br"
          code="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$base/api/hub/session")"
          echo "GET /api/hub/session -> $code"
          cat /tmp/session.json
          test "$code" = "200"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/session.json', encoding='utf-8'))
          assert isinstance(data.get('configured'), bool), data
          assert isinstance(data.get('authenticated'), bool), data
          assert data.get('authenticated') is False, data
          print('session contract ok; configured=', data['configured'])
          PY

      - name: Verificar proteção das APIs privadas
        shell: bash
        run: |
          set -euo pipefail
          base="https://arenalivebrasil.com.br"
          configured="$(python - <<'PY'
          import json
          print('true' if json.load(open('/tmp/session.json', encoding='utf-8')).get('configured') else 'false')
          PY
          )"

          routes=(
            '/api/hub/health'
            '/api/radar/today'
            '/api/radar/next'
            '/api/sults/chamados?start=0&limit=1'
            '/api/sults/implantacoes?start=0&limit=1'
            '/api/hub/inauguracoes'
            '/api/hub/financeiro'
            '/api/hub/planet/acquisition/lp-franquias'
            '/api/hub/planet/leads'
          )

          failures=0
          for route in "${routes[@]}"; do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' "$base$route")"
            echo "GET $route -> $code"

            if [[ "$configured" == "true" ]]; then
              if [[ "$code" != "401" ]]; then
                echo "ERRO: rota privada deveria responder 401 sem sessão."
                cat "$body" || true
                failures=$((failures + 1))
              fi
            else
              if [[ "$code" == "404" || "$code" =~ ^5 ]]; then
                echo "ERRO: rota inexistente ou indisponível com autenticação desativada."
                cat "$body" || true
                failures=$((failures + 1))
              fi
            fi
            rm -f "$body"
          done

          test "$failures" -eq 0
