name: Patch chamados recebidos
on:
  push:
    branches: [fix/chamados-recebidos-marketing-20260820]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chamados-recebidos-marketing-20260820
      - name: Ajustar escopo mine para caixa recebida do Marketing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/api/sults/chamados.js')
          s = p.read_text()
          s = s.replace("if (scope === 'mine') return personIsIncluded(ticket, personId, personName);", "if (scope === 'mine') return departmentIsIncluded(ticket, departmentId) || personIsIncluded(ticket, personId, personName);")
          s = s.replace("departmentId: scope === 'marketing' ? departmentId : null,", "departmentId: scope === 'marketing' || scope === 'mine' ? departmentId : null,")
          s = s.replace("membership: scope === 'mine' ? ['responsible', 'support'] : null,", "membership: scope === 'mine' ? ['marketing-inbox', 'responsible', 'support'] : null,")
          p.write_text(s)
          t = Path('tests/sults-chamados-contract-v1.test.mjs')
          x = t.read_text()
          marker = "console.log('SULTS chamados: contrato de token, leitura ao vivo e fallback por snapshot validado.');"
          extra = '''\n  {\n    const kv = makeKv();\n    globalThis.fetch = async (url) => {\n      const parsed = new URL(url);\n      const situation = Number(parsed.searchParams.get('situacao') || 1);\n      const inQueue = ticket(`queue-${situation}`, situation);\n      inQueue.responsavel = null;\n      return new Response(JSON.stringify({ data: [inQueue] }), { status: 200, headers: { 'Content-Type': 'application/json' } });\n    };\n    const response = await onRequestGet({\n      env: { SULTS_API_TOKEN: 'test-token', PLANET_HUB_DATA: kv },\n      request: requestFor('?scope=mine&includeIgnored=1'),\n    });\n    const body = await response.json();\n    assert.equal(response.status, 200);\n    assert.equal(body.data.length, 4, 'scope mine deve incluir chamados em fila do Marketing mesmo sem responsavel');\n    assert.deepEqual(body.filters.membership, ['marketing-inbox', 'responsible', 'support']);\n  }\n\n'''
          if 'scope mine deve incluir chamados em fila do Marketing' not in x:
              x = x.replace(marker, extra + marker)
              t.write_text(x)
          PY
      - name: Commitar patch
        run: |
          git config user.name "andre-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add functions/api/sults/chamados.js tests/sults-chamados-contract-v1.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: inclui fila recebida do Marketing em Meus chamados"
          git push
