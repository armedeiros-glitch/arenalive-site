name: Recover CotaPeca Sprint 2

on:
  push:
    branches: [cotapeca-recovery]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild recovered package
        shell: bash
        run: |
          set -euo pipefail
          cat recovery/chunk-01.b64 recovery/chunk-02.b64 recovery/chunk-03.b64 recovery/chunk-04.b64 recovery/chunk-05.b64 recovery/chunk-06.b64 > recovery/bundle.b64
          base64 -d recovery/bundle.b64 > recovery/cotapeca-sprint2.tgz
          echo "7779991563d347535c0c0067301f506d0a4346d20a22a2485eced524bd239247  recovery/cotapeca-sprint2.tgz" | sha256sum -c -
          rm -rf cotapeca-recovered
          mkdir cotapeca-recovered
          tar -xzf recovery/cotapeca-sprint2.tgz -C cotapeca-recovered
          rm -f recovery/bundle.b64 recovery/cotapeca-sprint2.tgz
      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotapeca-recovered
          if git diff --cached --quiet; then
            echo "No recovered source changes"
          else
            git commit -m "chore: recover CotaPeca Sprint 2 source"
            git push
          fi
