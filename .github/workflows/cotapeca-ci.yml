name: CotaPeca CI

on:
  push:
    branches: [cotapeca-recovery]
    paths:
      - 'cotapeca-recovered/**'
      - '.github/workflows/cotapeca-ci.yml'
  pull_request:
    branches: [main, cotapeca-recovery]
    paths:
      - 'cotapeca-recovered/**'
      - '.github/workflows/cotapeca-ci.yml'
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cotapeca-recovered
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://aenmxjmrhancvqgpunhk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UofCGoeTB-E3vJyWJXUepQ_U5Ka5tcM
      NEXT_PUBLIC_E2E_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify foundation
        run: npm run verify:foundation
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
