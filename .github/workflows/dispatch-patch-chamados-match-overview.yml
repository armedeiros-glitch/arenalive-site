name: Dispatch patch chamados match overview
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chamados-match-overview-20260820
          fetch-depth: 0
      - name: Aplicar correção
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('planet-hub/assets/ticket-command-v1.js')
          s=p.read_text()
          s=s.replace("const MINE_API = '/api/sults/chamados?scope=mine&includeIgnored=1';", "const MAIN_API = '/api/sults/chamados?start=0&limit=100';")
          s=s.replace('fetchTicketList(MINE_API)', 'fetchTicketList(MAIN_API)')
          s=s.replace("'Carregando meus chamados…'", "'Carregando chamados da Planet…'")
          s=s.replace('<h2>Meus chamados</h2><p>${total} chamado${total === 1 ? \'\' : \'s\'} aberto${total === 1 ? \'\' : \'s\'} no SULTS em que André está vinculado.</p>', '<h2>Chamados ativos</h2><p>${total} chamado${total === 1 ? \'\' : \'s\'} ativo${total === 1 ? \'\' : \'s\'} da Planet no SULTS.</p>')
          s=s.replace("${state.discovery ? 'Explorar SULTS' : 'Filtrar meus chamados'}", "${state.discovery ? 'Explorar SULTS' : 'Filtrar chamados'}")
          s=s.replace("${state.discovery ? '← Voltar aos meus chamados' : '＋ Todos do SULTS'}", "${state.discovery ? '← Voltar aos chamados da Planet' : '＋ Todos do SULTS'}")
          p.write_text(s)

          replacements={
          'tests/ticket-command-active-status-v1.test.mjs':[
          ("assert.match(source, /const MINE_API = '\\/api\\/sults\\/chamados\\?scope=mine&includeIgnored=1';/);","assert.match(source, /const MAIN_API = '\\/api\\/sults\\/chamados\\?start=0&limit=100';/);"),
          ("assert.match(source, /em que André está vinculado/);","assert.match(source, /da Planet no SULTS/);"),
          ("console.log('Chamados: backend scope=mine é source of truth e status terminais ficam fora da fila.');","console.log('Chamados: mesma fonte da Visão Geral e status terminais ficam fora da fila.');")],
          'tests/ticket-following-v1.test.mjs':[
          ("assert.match(source, /const MINE_API = '\\/api\\/sults\\/chamados\\?scope=mine&includeIgnored=1'/);","assert.match(source, /const MAIN_API = '\\/api\\/sults\\/chamados\\?start=0&limit=100'/);"),
          ("const ticketsFromMineApi = [","const ticketsFromMainApi = ["),
          ("Array.from(api.activeMineTickets(ticketsFromMineApi), (ticket) => ticket.sultsTicketId)","Array.from(api.activeMineTickets(ticketsFromMainApi), (ticket) => ticket.sultsTicketId)"),
          ("'frontend só deve remover status terminais; pertencimento já foi resolvido pelo backend'","'frontend só deve remover status terminais; o escopo Planet já vem da mesma fonte da Visão Geral'"),
          ("console.log('Chamados: scope=mine no backend, descoberta separada e status ativos validados.');","console.log('Chamados: fonte Planet igual à Visão Geral, descoberta separada e status ativos validados.');")],
          'tests/ticket-details-filter-ownership-v1.test.mjs':[
          ("assert.ok(command.includes(\"scope=mine&includeIgnored=1\"));","assert.ok(command.includes(\"/api/sults/chamados?start=0&limit=100\"));"),
          ("console.log('Chamados: filtros pertencem ao ticket-command e a fila pessoal vem pronta do backend.');","console.log('Chamados: filtros pertencem ao ticket-command e a lista usa a mesma fonte da Visão Geral.');")]
          }
          for fn,reps in replacements.items():
            q=Path(fn); x=q.read_text()
            for a,b in reps: x=x.replace(a,b)
            q.write_text(x)
          q=Path('index.html'); x=q.read_text().replace('ticket-command-v1.js?v=20260820-2','ticket-command-v1.js?v=20260820-3'); q.write_text(x)
          PY
      - name: Commitar no branch de correção
        run: |
          git config user.name "andre-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add planet-hub/assets/ticket-command-v1.js tests/ticket-command-active-status-v1.test.mjs tests/ticket-following-v1.test.mjs tests/ticket-details-filter-ownership-v1.test.mjs index.html
          git commit -m "fix: sincroniza Chamados com Visão Geral" || exit 0
          git push origin HEAD:fix/chamados-match-overview-20260820
