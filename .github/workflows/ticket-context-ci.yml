name: Contexto de chamados CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check planet-hub/assets/ticket-command-v1.js
          node --check planet-hub/assets/ticket-context-compact-v1.js
      - name: Validar contrato
        run: node tests/ticket-context-compact-v1.test.mjs
