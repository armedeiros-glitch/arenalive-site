name: André OS Smoke CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andre-os-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Sintaxe e contratos gerais
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            mime=$(file --brief --mime-type "$file")
            if [[ "$mime" == text/* || "$mime" == application/javascript ]]; then
              echo "node --check $file"
              node --check "$file"
            else
              echo "Ignorando asset não textual ($mime): $file"
            fi
          done < <(find functions planet-hub/assets workers -type f -name '*.js' -print0 2>/dev/null || true)

      - name: Executar todos os testes Node
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t tests < <(find tests -type f -name '*.test.mjs' | sort)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "Nenhum teste encontrado."
            exit 1
          fi

          echo "${#tests[@]} testes encontrados."
          failures=()

          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            if node "$test_file"; then
              echo "PASS $test_file"
            else
              echo "FAIL $test_file"
              failures+=("$test_file")
            fi
            echo "::endgroup::"
          done

          echo
          echo "Resumo: ${#tests[@]} executados · ${#failures[@]} falha(s)."
          if [[ ${#failures[@]} -gt 0 ]]; then
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi
